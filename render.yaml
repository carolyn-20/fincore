services:
  - type: web
    name: fincore-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: apps/api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30m
      - key: PROVIDER_MODE
        value: simulated
      - key: PROVIDER_WEBHOOK_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        value: https://fincore-api-4bc6.onrender.com
      - key: RISK_SERVICE_URL
        value: ""

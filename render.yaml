databases:
  - name: fincore-db
    plan: free
    databaseName: fincore
    user: fincore

services:
  - type: web
    name: fincore-api
    runtime: docker
    plan: free
    rootDir: apps/api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fincore-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30m
      - key: PROVIDER_MODE
        value: simulated
      - key: PROVIDER_WEBHOOK_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        value: https://fincore-web.onrender.com
      - key: RISK_SERVICE_URL
        value: http://fincore-risk:10000

  - type: web
    name: fincore-risk
    runtime: docker
    plan: free
    rootDir: apps/risk-service
    dockerfilePath: ./Dockerfile
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 10000

  - type: web
    name: fincore-web
    runtime: docker
    plan: free
    rootDir: apps/web
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: fincore-api
          type: web
          property: host
